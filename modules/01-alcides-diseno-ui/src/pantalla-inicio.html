<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVI · Inicio</title>
<link rel="stylesheet" href="estilos-ui.css">
<style>
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 2.5rem; align-items: center; min-height: 68vh; }
  .hero__copy h1 { margin-bottom: 1rem; }
  .hero__copy p.lead { font-size: 1.25rem; color: var(--muted); max-width: 46ch; }
  .hero__art { display: grid; place-items: center; }
  .hero__art svg { width: min(420px, 90%); filter: drop-shadow(0 18px 40px rgba(20,41,61,.18)); }
  .pills { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.6rem; }
  .pill-tag { padding: .4rem .9rem; border-radius: var(--pill); background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: .9rem; color: var(--navi-blue-ink); box-shadow: var(--shadow); }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; text-align: center; } .hero__copy p.lead { margin-inline: auto; } .fila { justify-content: center; } .pills { justify-content: center; } .hero__art { order: -1; } }
</style>
</head>
<body>
<main class="navi-wrap">

  <header class="navi-topbar">
    <span class="navi-brand">
      <span class="navi-brand__mark">
        <svg width="24" height="24" viewBox="0 0 48 48"><path d="M24 4l6 12.3 13.6 2-9.8 9.6 2.3 13.6L24 35.1 11.9 41.5l2.3-13.6L4.4 18.3l13.6-2z" fill="#ffc43d"/></svg>
      </span>
      <span class="navi-brand__name">NA<b>VI</b></span>
    </span>

    <button class="navi-user" type="button">
      <span class="navi-user__avatar">A</span>
      <span>Mi perfil</span>
    </button>
  </header>

  <section class="hero">
    <div class="hero__copy">
      <h1>Aventuras para aprender a cuidarte</h1>
      <p class="lead">Elige un cuento, toma decisiones y descubre cómo mantenerte seguro. Ganas estrellas por cada buena elección.</p>

      <div class="fila mt-3">
        <a class="btn btn--lg" href="pantalla-biblioteca.html">▶ Comenzar aventura</a>
        <a class="btn btn--secondary btn--lg" href="pantalla-biblioteca.html">Ver biblioteca</a>
      </div>

      <div class="pills">
        <span class="pill-tag">⭐ Gana estrellas</span>
        <span class="pill-tag">🧭 Decisiones seguras</span>
        <span class="pill-tag">🏅 Logros</span>
      </div>
    </div>

    <div class="hero__art">
      <!-- Mascota/guía NAVI: una estrella navegante -->
      <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-label="Mascota NAVI">
        <circle cx="160" cy="160" r="150" fill="#e8f1fd"/>
        <circle cx="160" cy="160" r="112" fill="#fff" stroke="#d7e3ee" stroke-width="2"/>
        <g transform="translate(160 160)">
          <path d="M0 -92L24 -24 94 -16 42 30 56 100 0 64 -56 100 -42 30 -94 -16 -24 -24z" fill="#ffc43d" stroke="#e0a800" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="-16" cy="2" r="7" fill="#16327e"/>
          <circle cx="18" cy="2" r="7" fill="#16327e"/>
          <path d="M-16 26q16 14 34 0" fill="none" stroke="#16327e" stroke-width="5" stroke-linecap="round"/>
          <circle cx="-30" cy="18" r="8" fill="#ffb3b3" opacity=".7"/>
          <circle cx="32" cy="18" r="8" fill="#ffb3b3" opacity=".7"/>
        </g>
        <g fill="#2356d8">
          <circle cx="58" cy="70" r="6"/><circle cx="268" cy="120" r="5"/><circle cx="74" cy="250" r="5"/><circle cx="252" cy="236" r="7"/>
        </g>
      </svg>
    </div>
  </section>

</main>
</body>
</html>
