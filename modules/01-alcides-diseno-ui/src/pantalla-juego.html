<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVI · Cuento</title>
<link rel="stylesheet" href="estilos-ui.css">
<style>
  .game { display: grid; grid-template-columns: 1.15fr .85fr; gap: 1.4rem; align-items: start; }
  .escena__img { aspect-ratio: 16/10; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
  .escena__img svg { width: 100%; height: 100%; display: block; }
  .opciones { display: grid; gap: .8rem; margin-top: 1.2rem; }
  .opcion { justify-content: flex-start; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
  .opcion:hover { border-color: var(--navi-blue); }
  .marcador { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .puntos { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--font-display); font-weight: 800; color: var(--navi-blue-ink); background: var(--sun-soft); padding: .35rem .8rem; border-radius: var(--pill); }
  @media (max-width: 820px) { .game { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="navi-wrap">

  <header class="navi-topbar">
    <a class="navi-brand" href="pantalla-biblioteca.html" style="text-decoration:none">
      <span class="navi-brand__mark">
        <svg width="24" height="24" viewBox="0 0 48 48"><path d="M24 4l6 12.3 13.6 2-9.8 9.6 2.3 13.6L24 35.1 11.9 41.5l2.3-13.6L4.4 18.3l13.6-2z" fill="#ffc43d"/></svg>
      </span>
      <span class="navi-brand__name">NA<b>VI</b></span>
    </a>
    <span class="puntos">⭐ <span>20</span> puntos</span>
  </header>

  <div class="marcador">
    <span class="logro" style="background:var(--navi-blue-soft);color:var(--navi-blue-ink)">Me perdí en el parque · Escena 2 de 5</span>
  </div>
  <div class="barra" aria-label="Progreso del cuento 40%"><span style="width:40%;background:var(--navi-blue)"></span></div>

  <section class="game mt-3">
    <div>
      <div class="escena__img">
        <svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escena del cuento">
          <rect width="640" height="400" fill="#dff3ff"/>
          <circle cx="520" cy="80" r="46" fill="#ffc43d"/>
          <path d="M0 300q120-60 220 0t220-30 200 30V400H0z" fill="#dff8ea"/>
          <path d="M0 340q160-40 320 0t320 0V400H0z" fill="#bfe8cf"/>
          <g transform="translate(150 210)">
            <rect x="-10" y="40" width="20" height="60" rx="8" fill="#16327e"/>
            <circle cx="0" cy="20" r="24" fill="#ffd9b3"/>
            <path d="M-24 44a24 30 0 0148 0z" fill="#e5484d"/>
          </g>
          <g transform="translate(430 190)">
            <rect x="-14" y="60" width="28" height="90" rx="10" fill="#6b4a2b"/>
            <circle cx="0" cy="30" r="56" fill="#1fa971"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="panel">
      <h3>¿Qué deberías hacer?</h3>
      <p>Estabas con tu familia en el parque, pero te distrajiste mirando los juegos y ahora no los ves. ¿Qué haces?</p>

      <div class="opciones">
        <button class="btn opcion">🧍 Quedarte en un lugar visible y esperar</button>
        <button class="btn opcion">👮 Buscar a un guardia o encargado del parque</button>
        <button class="btn opcion">🏃 Salir corriendo a buscarlos por todos lados</button>
      </div>

      <div class="mensaje mensaje--positivo mt-3">
        <span class="mensaje__icono">✅</span>
        <span>¡Buena idea! Quedarte quieto y pedir ayuda a un adulto de confianza es lo más seguro.</span>
      </div>
    </div>
  </section>

</main>
</body>
</html>
