<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Auth y Roles - NAVI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-shell">
    <!-- 1. PANTALLA: LOGIN -->
    <div id="view-login" class="card auth-card my-view">
      <div class="card-body">
        <div class="brand-wrap">
          <div class="brand-badge">
            <i class="bi bi-compass"></i>
          </div>
          <div class="brand-copy">
            <span class="eyebrow">Plataforma Educativa</span>
            <h3>NAVI</h3>
          </div>
        </div>

        <h3 class="form-title">Iniciar Sesión</h3>
        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-login" class="input-stack">
          <div class="input-wrap">
            <span class="input-icon"><i class="bi bi-envelope"></i></span>
            <input type="email" id="login-email" class="form-control" placeholder="Correo electrónico" required>
          </div>

          <div class="input-wrap">
            <span class="input-icon"><i class="bi bi-lock"></i></span>
            <input type="password" id="login-password" class="form-control" placeholder="Contraseña" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-navi">Ingresar</button>
          </div>
        </form>

        <div class="form-footer">
          <span>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></span>
        </div>
      </div>
    </div>

    <!-- 2. PANTALLA: USUARIO LOGUEADO / DASHBOARD -->
    <div id="view-dashboard" class="card shadow-sm mx-auto d-none my-view" style="max-width: 600px;">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 id="user-welcome" class="card-title mb-0">Bienvenido</h3>
          <button class="btn btn-outline-danger btn-sm" onclick="logout()">Cerrar sesión</button>
        </div>
        <div class="alert alert-info" id="user-role-badge"></div>
        <h5 class="mt-4">Prueba de Validación de Roles:</h5>
        <p class="text-muted small">Intenta ingresar a las vistas protegidas para validar permisos:</p>
        <div class="btn-group-vertical w-100 mb-3">
          <button class="btn btn-outline-primary text-start" onclick="navigateAndProtect('nino')">Módulo Niño (Juegos)</button>
          <button class="btn btn-outline-success text-start" onclick="navigateAndProtect('tutor')">Módulo Tutor (Progreso)</button>
          <button class="btn btn-outline-warning text-start" onclick="navigateAndProtect('educador')">Módulo Educador (Reportes)</button>
          <button class="btn btn-outline-danger text-start" onclick="navigateAndProtect('admin')">Módulo Admin (Contenidos)</button>
        </div>
      </div>
    </div>

    <!-- 3. PANTALLA: ACCESO DENEGADO -->
    <div id="view-access-denied" class="card shadow-sm mx-auto d-none border-danger my-view" style="max-width: 500px;">
      <div class="card-body text-center">
        <h1 class="display-1 text-danger">🚫</h1>
        <h3 class="text-danger mb-3">Acceso Denegado</h3>
        <p>No tienes los permisos necesarios con tu rol actual para acceder a esta sección.</p>
        <button class="btn btn-secondary mt-3" onclick="showDashboard()">Volver al Panel Principal</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="roles.js"></script>
</body>
</html>
